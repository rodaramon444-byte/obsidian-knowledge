name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Obsidian vault
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Quartz
        working-directory: quartz
        run: npm ci

      - name: Configure Quartz content
        run: |
          rm -rf quartz/content
          ln -s "$GITHUB_WORKSPACE/vault" quartz/content
          cp vault/quartz.config.yaml quartz/quartz.config.yaml

      - name: Install Quartz plugins and theme
        working-directory: quartz
        run: |
          npx quartz plugin install --from-config
          npm install @quartz-themes/default

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
